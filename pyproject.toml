[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "askanswer"
version = "0.1.0"
description = "AskAnswer LangGraph agent core"
requires-python = ">=3.10"
dependencies = [
    # --- Orchestration / LLM ---
    # Used across graph, nodes, tools, subgraphs (import: langchain, langchain_core, langgraph)
    "langchain>=1.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",  # sqlagent (SQLDatabase / SQLDatabaseToolkit)
    "langchain-openai>=0.3.0",  # default openai provider via init_chat_model (load.py)
    "langgraph>=1.1.5",
    "langgraph-checkpoint-sqlite>=2.0",  # persistence SqliteSaver
    "pydantic>=2.7",  # structured outputs and dynamic tool schemas

    # --- Tools & protocols ---
    "mcp",  # MCP client integration
    "tavily-python",  # web search client (load.py → TavilyClient)
    "markitdown",  # read_file document conversion (tools.py)

    # --- Runtime config ---
    "python-dotenv",  # .env loading (load.py)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Soft imports in askanswer/telemetry/* (try/except ImportError → no-op).
# Install when enabling LangSmith / OTEL exporters:
#   pip install -e ".[telemetry]"
telemetry = [
    "langsmith",
    "opentelemetry-api",
]

[tool.setuptools.packages.find]
include = ["askanswer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 保守起步的可全绿规则集：pyflakes(F)、pycodestyle 错误(E)、isort(I)。
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["askanswer"]
