[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "askanswer"
version = "0.1.0"
description = "Embeddable LangGraph agent core: intent routing, tools, HITL approvals, persistence"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Right202209" }]
keywords = ["langgraph", "langchain", "agent", "llm", "human-in-the-loop", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # --- Orchestration / LLM ---
    # Used across core, tools, subagents (import: langchain, langchain_core, langgraph)
    "langchain>=1.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.0",  # default openai provider via init_chat_model (llm/proxy.py)
    "langgraph>=1.1.5",
    "langgraph-checkpoint-sqlite>=2.0",  # persistence SqliteSaver
    "pydantic>=2.7",  # structured outputs and dynamic tool schemas
    "sqlalchemy>=2.0",  # SQL subagent: engine, inspection, query execution (subagents/sql)

    # --- Tools & protocols ---
    "mcp",  # MCP client integration
    "tavily-python",  # web search client (tools/builtin.py, built lazily)
    "markitdown",  # read_file document conversion (tools/filesystem.py, imported lazily)

    # --- Runtime config ---
    "python-dotenv",  # .env loading (config/settings.py, lazy bootstrap)
]

[project.urls]
Homepage = "https://github.com/Right202209/AskAnswer"
Repository = "https://github.com/Right202209/AskAnswer"
Issues = "https://github.com/Right202209/AskAnswer/issues"
Changelog = "https://github.com/Right202209/AskAnswer/blob/core-agent/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
# Soft imports in askanswer/observability/{langsmith,otel}.py (ImportError → no-op).
# Install when enabling LangSmith / OTEL exporters:
#   pip install -e ".[telemetry]"
telemetry = [
    "langsmith",
    "opentelemetry-api",
]

[tool.setuptools.packages.find]
include = ["askanswer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# 保守起步的可全绿规则集：pyflakes(F)、pycodestyle 错误(E)、isort(I)。
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["askanswer"]
